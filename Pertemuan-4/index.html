<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Portfolio Tracker</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-sky-500/20">
                    <i class="fa-solid font-bold fa-chart-pie text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Interactive Portfolio Tracker</h1>
                    <p class="text-xs sm:text-sm text-slate-500">Kelola dan pantau seluruh pengerjaan proyek portofolio Anda</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span> Dashboard Aktif
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 space-y-8">

        <!-- Papan Statistik -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Card 1: Total Proyek -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-all flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Total Proyek</p>
                    <h3 class="text-2xl font-bold text-slate-900" id="stat-total-projects">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
            </div>

            <!-- Card 2: Selesai -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-all flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Selesai</p>
                    <h3 class="text-2xl font-bold text-emerald-600" id="stat-completed-projects">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>

            <!-- Card 3: Dalam Pengerjaan -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-all flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Dalam Pengerjaan</p>
                    <h3 class="text-2xl font-bold text-amber-600" id="stat-in-progress">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-spinner"></i>
                </div>
            </div>

            <!-- Card 4: Total Anggaran -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-all flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Total Anggaran</p>
                    <h3 class="text-xl font-bold text-slate-900" id="stat-total-budget">Rp 0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-wallet"></i>
                </div>
            </div>
        </section>

        <!-- Progress Bar Overview -->
        <section class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-2">
            <div class="flex justify-between items-center text-sm">
                <span class="font-medium text-slate-600">Progres Penyelesaian Proyek</span>
                <span class="font-bold text-slate-900" id="stat-progress-percent">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                <div id="stat-progress-bar" class="bg-gradient-to-r from-sky-500 to-emerald-500 h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- FITUR 1: Formulir Input Proyek Dinamis -->
            <section class="lg:col-span-5 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm sticky top-24">
                <div class="flex items-center gap-3 pb-4 mb-5 border-b border-slate-100">
                    <div class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-sm font-semibold">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-900">Tambah Proyek Baru</h2>
                        <p class="text-xs text-slate-500">Isi detail proyek di bawah ini</p>
                    </div>
                </div>

                <form id="project-form" class="space-y-4">
                    <div class="form-group">
                        <label for="title" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Judul Proyek</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-pen-nib text-sm"></i>
                            </span>
                            <input type="text" id="title" placeholder="Contoh: Redesign Aplikasi Mobile" class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent text-sm transition-all">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="category" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Kategori</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-layer-group text-sm"></i>
                            </span>
                            <select id="category" class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent text-sm transition-all appearance-none cursor-pointer">
                                <option value="Web App">Web App</option>
                                <option value="Mobile App">Mobile App</option>
                                <option value="Desktop App">Desktop App</option>
                                <option value="UI/UX Design">UI/UX Design</option>
                            </select>
                            <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="budget" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Estimasi Anggaran (Rp)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 font-medium text-xs">
                                Rp
                            </span>
                            <input type="number" id="budget" placeholder="5000000" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent text-sm transition-all">
                        </div>
                    </div>

                    <div class="pt-2">
                        <label class="relative inline-flex items-center cursor-pointer select-none">
                            <input type="checkbox" id="completed" class="sr-only peer">
                            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-emerald-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                            <span class="ml-3 text-sm font-medium text-slate-700">Sudah Selesai Dikerjakan</span>
                        </label>
                    </div>

                    <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-semibold rounded-xl shadow-md shadow-emerald-500/20 hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-plus-circle"></i> Tambah Proyek
                    </button>
                </form>
            </section>

            <!-- Main Content Area: Search, Filter, & List Proyek -->
            <section class="lg:col-span-7 space-y-6">
                
                <!-- FITUR 2: Pencarian Real-Time & Filter Kategori -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                    <!-- Search Input -->
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-sm"></i>
                        </span>
                        <input type="text" id="search" placeholder="Cari nama proyek di sini..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent text-sm transition-all">
                    </div>

                    <!-- Filter Kategori Bawaan -->
                    <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none filter-container">
                        <button class="btn-filter active whitespace-nowrap px-4 py-2 rounded-xl text-xs font-semibold transition-all border border-sky-500 bg-sky-500 text-white shadow-sm flex items-center gap-1.5 cursor-pointer" data-category="Semua">
                            <span>Semua</span>
                            <span class="filter-count bg-white/20 text-white px-1.5 py-0.5 rounded-full text-[10px]">0</span>
                        </button>
                        <button class="btn-filter whitespace-nowrap px-4 py-2 rounded-xl text-xs font-semibold transition-all border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 flex items-center gap-1.5 cursor-pointer" data-category="Web App">
                            <span>Web App</span>
                            <span class="filter-count bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded-full text-[10px]">0</span>
                        </button>
                        <button class="btn-filter whitespace-nowrap px-4 py-2 rounded-xl text-xs font-semibold transition-all border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 flex items-center gap-1.5 cursor-pointer" data-category="Mobile App">
                            <span>Mobile App</span>
                            <span class="filter-count bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded-full text-[10px]">0</span>
                        </button>
                        <button class="btn-filter whitespace-nowrap px-4 py-2 rounded-xl text-xs font-semibold transition-all border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 flex items-center gap-1.5 cursor-pointer" data-category="Desktop App">
                            <span>Desktop App</span>
                            <span class="filter-count bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded-full text-[10px]">0</span>
                        </button>
                        <button class="btn-filter whitespace-nowrap px-4 py-2 rounded-xl text-xs font-semibold transition-all border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 flex items-center gap-1.5 cursor-pointer" data-category="UI/UX Design">
                            <span>UI/UX Design</span>
                            <span class="filter-count bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded-full text-[10px]">0</span>
                        </button>
                    </div>
                </div>

                <!-- Tempat Daftar Proyek -->
                <div id="project-list" class="space-y-4"></div>

            </section>
        </div>
    </main>

    <!-- Container Toast Notification -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- Panggilan Berkas Script JavaScript Terpisah -->
    <script src="main.js"></script>
</body>
</html>
